# ─────────────────────────────────────────────────────────
# config/config.yaml  — Runtime configuration (no secrets)
# Secrets come from environment variables / .env
# ─────────────────────────────────────────────────────────

database:
  host: ${POSTGRES_HOST:-localhost}
  port: ${POSTGRES_PORT:-5432}
  name: ${POSTGRES_DB:-segmentation}
  user: ${POSTGRES_USER:-admin}
  pool_size: 5
  max_overflow: 10

data:
  lookback_days: 30
  raw_dir: data/raw
  processed_dir: data/processed
  models_dir: data/models
  sample_users: 10000           # for synthetic data generation

features:
  engagement_weights:
    sessions_per_user: 0.3
    avg_session_duration: 0.3
    active_days: 0.25
    recency_inv: 0.15
  monetization_weights:
    total_earnings: 0.4
    total_redemptions: 0.3
    ctr: 0.3
  churn_risk_weights:
    recency: 0.5
    active_days_inv: 0.3
    avg_session_duration_inv: 0.2
  outlier_iqr_factor: 1.5
  log_transform_cols:
    - total_earnings
    - total_redemptions
    - wallet_balance
    - avg_transaction_value
    - sessions_per_user

kmeans:
  n_clusters: 5
  random_state: 42
  n_init: 10
  max_iter: 300
  k_range: [2, 3, 4, 5, 6, 7, 8, 9, 10]  # for elbow method

dbscan:
  eps: 0.5
  min_samples: 5
  metric: euclidean
  n_jobs: -1

segment_labels:
  # Maps cluster ID → business label (update after profiling)
  0: "Whales"
  1: "Casual Earners"
  2: "Ad Hunters"
  3: "Dormant Users"
  4: "Rising Stars"

segment_bid_strategy:
  Whales:         HIGH
  Rising Stars:   MEDIUM_HIGH
  Ad Hunters:     MEDIUM
  Casual Earners: LOW_MEDIUM
  Dormant Users:  SUPPRESSED

monitoring:
  drift_threshold: 0.15       # alert if segment distribution shifts >15%
  silhouette_min: 0.25        # alert if silhouette drops below this
  check_interval_hours: 24

api:
  host: "0.0.0.0"
  port: 8000
  reload: false
  workers: 2

pipeline:
  schedule: "@weekly"
  retry_count: 3
  notify_email: "team@example.com"
