[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=src --cov-report=term-missing --cov-report=html:reports/coverage"
log_cli = true
log_cli_level = "WARNING"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/sample/*"]
