[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greedygame-user-segmentation"
version = "1.0.0"
description = "Production-ready K-Means and DBSCAN user segmentation pipeline for ad targeting."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.4.0",
  "pyyaml>=6.0.1",
  "joblib>=1.3.2",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.6.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
user-segmentation = "user_segmentation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
